<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="title"><title id="title">dynamic workflow 动态展开</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6z" fill="#176b52"/></marker><style>text{font-family:system-ui,sans-serif;fill:#202322}.b{fill:#e9f4ef;stroke:#176b52;stroke-width:2}.g{fill:#f0f2f1;stroke:#68706c;stroke-width:2}</style></defs><rect width="960" height="380" rx="18" fill="#fbfbfa"/><text x="38" y="40" font-size="22" font-weight="700">执行图在运行时长出来</text><rect class="g" x="55" y="155" width="140" height="60" rx="12"/><text x="125" y="191" text-anchor="middle" font-size="16">事故描述</text><rect class="b" x="275" y="155" width="170" height="60" rx="12"/><text x="360" y="191" text-anchor="middle" font-size="16">规划 1–4 个假设</text><rect class="g" x="530" y="70" width="150" height="52" rx="12"/><text x="605" y="102" text-anchor="middle" font-size="15">调查 1</text><rect class="g" x="530" y="145" width="150" height="52" rx="12"/><text x="605" y="177" text-anchor="middle" font-size="15">调查 2</text><rect class="g" x="530" y="220" width="150" height="52" rx="12"/><text x="605" y="252" text-anchor="middle" font-size="15">调查 N</text><rect class="b" x="760" y="145" width="145" height="60" rx="12"/><text x="832" y="181" text-anchor="middle" font-size="15">证据评审</text><rect class="b" x="760" y="275" width="145" height="60" rx="12"/><text x="832" y="311" text-anchor="middle" font-size="15">报告 / 二次验证</text><path d="M195 185H265M445 185H520M680 96H750M680 171H750M680 246H750M832 210V265" stroke="#176b52" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="710" y="250" font-size="13" fill="#68706c">证据不足时追加 0–3 个</text></svg>
