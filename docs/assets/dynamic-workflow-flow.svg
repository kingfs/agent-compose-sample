<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">事故调查临时小队</title><desc id="d">规划者根据事故线索，从候场区邀请不同数量的专家来到调查桌前</desc><defs><style>text{font-family:system-ui,sans-serif}.i{fill:#17342b}.l{stroke:#17342b;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.card{fill:#fffdf5;stroke:#17342b;stroke-width:4}.tag{font-size:19px;font-weight:700}.tiny{font-size:17px}</style></defs><rect width="1200" height="620" rx="28" fill="#142a25"/><rect x="30" y="30" width="1140" height="560" rx="22" fill="#f2ead8"/><text x="60" y="76" class="i" font-size="30" font-weight="800">凌晨 02:17 · 临时调查小队正在成团</text><text x="920" y="73" fill="#c94f48" font-size="20" font-weight="800">事故不是自助餐，别全拿</text>
<!-- board --> <rect x="60" y="110" width="390" height="330" rx="16" fill="#285446" class="l"/><text x="88" y="150" fill="white" font-size="23" font-weight="800">现场线索</text><path d="M95 182h310M95 240h240M95 298h280" stroke="#cce9da" stroke-width="8" stroke-linecap="round"/><circle cx="110" cy="365" r="18" fill="#ff7b67"/><text x="145" y="374" fill="white" font-size="19">发布后延迟升高</text><g transform="translate(350 410) rotate(-5)"><rect width="145" height="80" rx="8" fill="#ffd66b" class="l"/><text x="20" y="35" class="i tiny">先列假设</text><text x="20" y="62" class="i tiny">再叫人！</text></g>
<!-- round table --> <ellipse cx="760" cy="430" rx="300" ry="105" fill="#62c29a" class="l"/><ellipse cx="760" cy="415" rx="250" ry="65" fill="#d7f0e4"/><text x="665" y="425" class="i" font-size="24" font-weight="800">证据桌 · 不收“我觉得”</text>
<!-- people --> <g><circle cx="590" cy="250" r="48" fill="#ffd1b8" class="l"/><path d="M548 242q20-65 82-30l8 38" class="i"/><path d="M530 375q8-90 60-90t65 90" fill="#6aa8d9" class="l"/><rect x="535" y="330" width="120" height="40" rx="12" class="card"/><text x="555" y="356" class="i tag">应用</text></g><g><circle cx="760" cy="215" r="48" fill="#bc815f" class="l"/><path d="M715 205q12-60 86-22l7 35" class="i"/><path d="M700 350q8-90 60-90t65 90" fill="#ffd66b" class="l"/><rect x="705" y="305" width="120" height="40" rx="12" class="card"/><text x="725" y="331" class="i tag">数据库</text></g><g><circle cx="930" cy="250" r="48" fill="#ffd1b8" class="l"/><path d="M887 232q25-62 78-18l10 34" class="i"/><path d="M870 375q8-90 60-90t65 90" fill="#ff8d73" class="l"/><rect x="875" y="330" width="120" height="40" rx="12" class="card"/><text x="895" y="356" class="i tag">下游</text></g>
<!-- standby door --> <rect x="1020" y="135" width="115" height="270" rx="15" fill="#fffdf5" class="l"/><text x="1077" y="172" text-anchor="middle" class="i tiny">候场区</text><circle cx="1077" cy="225" r="30" fill="#c8a8dc" class="l"/><circle cx="1077" cy="315" r="30" fill="#6aa8d9" class="l"/><text x="1077" y="385" text-anchor="middle" class="i tiny">按需叫人</text>
<rect x="70" y="505" width="1060" height="56" rx="14" fill="#17342b"/><text x="600" y="541" text-anchor="middle" fill="white" font-size="21">1–4 个假设 → 按现场调查 → 证据不足再加 0–3 位验证者</text></svg>
