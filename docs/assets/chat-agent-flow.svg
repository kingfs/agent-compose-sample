<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d">
<title id="t">阿布与数字接待员</title><desc id="d">办公室里阿布被重复问题淹没，数字接待员同时从终端和网页窗口接待访客</desc>
<defs><style>text{font-family:system-ui,-apple-system,sans-serif}.ink{fill:#18352c}.line{stroke:#18352c;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.paper{fill:#fffdf5;stroke:#18352c;stroke-width:4}.green{fill:#62c29a;stroke:#18352c;stroke-width:5}.yellow{fill:#ffd66b;stroke:#18352c;stroke-width:5}.coral{fill:#ff8d73;stroke:#18352c;stroke-width:5}.small{font-size:20px}.label{font-size:24px;font-weight:700}</style></defs>
<rect width="1200" height="620" rx="28" fill="#eaf5ef"/><circle cx="1055" cy="90" r="90" fill="#ffd66b" opacity=".55"/><path d="M0 510Q280 465 570 520T1200 500V620H0Z" fill="#cce9da"/>
<text x="55" y="65" class="ink" font-size="30" font-weight="800">前台来了位“不怕再问一次”的新同事</text>
<!-- A Bu --> <circle cx="170" cy="255" r="58" fill="#ffd1b8" class="line"/><path d="M118 241q20-80 100-34l13 43q-42-32-113-9" class="ink"/><circle cx="151" cy="259" r="5"/><circle cx="191" cy="259" r="5"/><path d="M153 288q19 11 36-1" fill="none" class="line"/><path d="M100 465q5-150 70-150t76 150" class="coral"/><text x="118" y="390" class="ink label">阿布</text>
<!-- sticky questions --> <g transform="rotate(-7 90 120)"><rect x="40" y="100" width="175" height="75" rx="8" class="paper"/><text x="58" y="132" class="ink small">报销入口</text><text x="58" y="158" class="ink small">到底在哪？</text></g><g transform="rotate(5 275 170)"><rect x="220" y="125" width="190" height="75" rx="8" class="paper"/><text x="240" y="170" class="ink small">再问一次 🙋</text></g><g transform="rotate(-3 285 270)"><rect x="250" y="230" width="190" height="70" rx="8" class="paper"/><text x="272" y="272" class="ink small">入口在哪 +1</text></g>
<!-- counter desk --> <path d="M425 365h680v180H425z" class="yellow"/><text x="790" y="510" class="ink" font-size="25" font-weight="800">CHAT 接待台</text>
<!-- bot --> <rect x="700" y="180" width="185" height="185" rx="42" class="green"/><path d="M792 180v-35m-18 0h36" class="line" fill="none"/><circle cx="755" cy="245" r="12" class="ink"/><circle cx="830" cy="245" r="12" class="ink"/><path d="M750 303q42 27 84-2" fill="none" class="line"/><rect x="747" y="338" width="90" height="35" rx="15" class="paper"/><text x="763" y="363" class="ink small">值班中</text>
<!-- two windows --> <rect x="470" y="110" width="175" height="125" rx="16" class="paper"/><circle cx="495" cy="133" r="7" fill="#ff8d73"/><circle cx="518" cy="133" r="7" fill="#ffd66b"/><path d="M492 167h130M492 192h80" class="line" stroke-width="3"/><text x="520" y="225" class="ink small">终端窗口</text><rect x="930" y="120" width="205" height="130" rx="18" class="paper"/><path d="M960 154h145v60H960z" fill="#cce9da"/><circle cx="983" cy="185" r="15" class="green"/><path d="M1010 172h76M1010 198h55" class="line" stroke-width="3"/><text x="985" y="242" class="ink small">网页 / App</text>
<!-- speech bubbles --> <path d="M890 280h205q25 0 25 25v32q0 25-25 25H990l-28 30 4-30h-76q-25 0-25-25v-32q0-25 25-25" class="paper"/><text x="905" y="330" class="ink small">您好，我来回答。</text>
</svg>
