<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title"><title id="title">scheduled-agent 四种触发方式</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6z" fill="#176b52"/></marker><style>text{font-family:system-ui,sans-serif;fill:#202322}.b{fill:#e9f4ef;stroke:#176b52;stroke-width:2}.g{fill:#f0f2f1;stroke:#68706c;stroke-width:2}</style></defs><rect width="960" height="300" rx="18" fill="#fbfbfa"/><text x="38" y="40" font-size="22" font-weight="700">四个门铃，一位值班员</text><rect class="g" x="60" y="78" width="170" height="42" rx="10"/><text x="145" y="105" text-anchor="middle" font-size="15">cron · 到点</text><rect class="g" x="60" y="132" width="170" height="42" rx="10"/><text x="145" y="159" text-anchor="middle" font-size="15">interval · 间隔</text><rect class="g" x="60" y="186" width="170" height="42" rx="10"/><text x="145" y="213" text-anchor="middle" font-size="15">timeout · 等一下</text><rect class="g" x="60" y="240" width="170" height="42" rx="10"/><text x="145" y="267" text-anchor="middle" font-size="15">event · 有事发生</text><rect class="b" x="400" y="142" width="180" height="70" rx="14"/><text x="490" y="184" text-anchor="middle" font-size="18" font-weight="700">assistant Agent</text><rect class="b" x="750" y="142" width="150" height="70" rx="14"/><text x="825" y="184" text-anchor="middle" font-size="16">任务结果</text><path d="M230 99H350V160H390M230 153H350V170H390M230 207H350V190H390M230 261H350V210H390M590 177H740" stroke="#176b52" stroke-width="3" fill="none" marker-end="url(#a)"/></svg>
