<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">小钟和四种闹钟</title><desc id="d">一位值班员坐在桌前，四个不同性格的闹钟代表 cron、interval、timeout 和 event</desc><defs><style>text{font-family:system-ui,sans-serif}.i{fill:#17342b}.l{stroke:#17342b;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.tag{font-size:19px;font-weight:800}</style></defs><rect width="1200" height="620" rx="28" fill="#fff4d6"/><text x="55" y="65" class="i" font-size="30" font-weight="800">值班室 09:00 · 四个闹钟都觉得自己最重要</text><path d="M0 510q300-45 600 0t600 0v110H0z" fill="#cce9da"/>
<!-- worker --> <circle cx="600" cy="220" r="62" fill="#ffd1b8" class="l"/><path d="M545 205q18-78 92-37l24 45" class="i"/><circle cx="580" cy="230" r="6"/><circle cx="624" cy="230" r="6"/><path d="M582 259q20-9 40 0" fill="none" class="l"/><path d="M500 480q8-190 100-190t110 190" fill="#62c29a" class="l"/><text x="565" y="390" class="i" font-size="25" font-weight="800">小钟</text>
<!-- desk --> <rect x="375" y="425" width="470" height="115" rx="14" fill="#b77b50" class="l"/><path d="M420 540v55M800 540v55" class="l"/>
<!-- clocks --> <g transform="translate(80 125)"><circle cx="105" cy="105" r="82" fill="#ff8d73" class="l"/><path d="M105 105V55M105 105l42 20" class="l"/><path d="M45 37L20 10M165 37l25-27" class="l"/><text x="105" y="220" text-anchor="middle" class="i tag">CRON</text><text x="105" y="246" text-anchor="middle" class="i">“到点啦！”</text></g><g transform="translate(305 95)"><rect x="5" y="25" width="155" height="155" rx="28" fill="#6aa8d9" class="l"/><path d="M42 70h82M42 105h55M42 140h70" class="l"/><text x="82" y="215" text-anchor="middle" class="i tag">INTERVAL</text><text x="82" y="241" text-anchor="middle" class="i">“又隔一小时！”</text></g><g transform="translate(750 100)"><path d="M30 35h140v145H30z" fill="#c8a8dc" class="l"/><path d="M75 10h50M100 10v25" class="l"/><text x="100" y="115" text-anchor="middle" class="i" font-size="42" font-weight="800">30s</text><text x="100" y="215" text-anchor="middle" class="i tag">TIMEOUT</text><text x="100" y="241" text-anchor="middle" class="i">“等够了！”</text></g><g transform="translate(980 125)"><path d="M20 55q70-70 140 0v95H20z" fill="#ffd66b" class="l"/><circle cx="90" cy="95" r="22" fill="#ff8d73" class="l"/><path d="M90 0v30M175 45l-25 16M5 45l25 16" class="l"/><text x="90" y="220" text-anchor="middle" class="i tag">EVENT</text><text x="90" y="246" text-anchor="middle" class="i">“外面有事！”</text></g>
<!-- sound marks --> <g fill="none" stroke="#17342b" stroke-width="5" stroke-linecap="round"><path d="M90 95l-30-24M295 95l30-24M760 80l-25-30M940 85l25-28M1050 85v-35"/></g><rect x="485" y="500" width="250" height="55" rx="14" fill="#17342b"/><text x="610" y="535" text-anchor="middle" fill="white" font-size="20" font-weight="700">同一个 assistant 值班</text></svg>
