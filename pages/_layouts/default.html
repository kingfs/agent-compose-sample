<!doctype html>
<html lang="{{ page.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{{ page.title | escape }} · {{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <a class="site-name" href="{{ page.home_url | default: '/' | relative_url }}">{{ site.title }}</a>
      <nav aria-label="Language">
        <a href="{{ page.alternate_url | relative_url }}" hreflang="{{ page.alternate_lang }}">{{ page.alternate_label }}</a>
        <a href="{{ site.github.repository_url }}">GitHub</a>
      </nav>
    </header>
    <main>{{ content }}</main>
    <footer>
      <span>{{ site.github.repository_nwo }}</span>
      <span>{{ site.github.build_revision | slice: 0, 7 }}</span>
    </footer>
  </body>
</html>
